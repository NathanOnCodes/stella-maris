name: vox-regina-caeli-dev

services:
  db:
    image: postgres:16-alpine
    env_file: .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vox_regina_caeli_dev}
      POSTGRES_USER: ${POSTGRES_USER:-vox_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vox_dev_password}
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: .env.dev
    environment:
      DEBUG: "true"
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - media_dev_data:/app/media
      - static_dev_data:/app/staticfiles
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >-
      sh -c "uv sync --locked &&
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    env_file: .env.dev
    environment:
      NODE_ENV: development
      API_URL: http://backend:8000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "${NGINX_DEV_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - media_dev_data:/var/www/media:ro
      - static_dev_data:/var/www/staticfiles:ro

volumes:
  postgres_dev_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
  media_dev_data:
  static_dev_data:
